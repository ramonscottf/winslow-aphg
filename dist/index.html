<style>
:root {
  --bg: #0f0f13;
  --surface: #1a1a24;
  --surface2: #242436;
  --accent: #6c5ce7;
  --accent-light: #a29bfe;
  --green: #00b894;
  --red: #ff6b6b;
  --orange: #fdcb6e;
  --text: #f0f0f5;
  --text2: #a0a0b8;
  --radius: 16px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; min-height:100dvh; overflow-x:hidden; -webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:contain;
}
.container { max-width:480px; margin:0 auto; padding:16px; }

/* Header */
.header {
  text-align:center; padding:24px 0 8px;
}
.header h1 { font-size:1.8rem; font-weight:900; letter-spacing:-0.5px; }
.header h1 span { background:linear-gradient(135deg,var(--accent-light),#74b9ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
.header .subtitle { color:var(--text2); font-size:0.85rem; margin-top:4px; }
.streak-badge {
  display:inline-flex; align-items:center; gap:4px; background:linear-gradient(135deg,#ff6b6b,#fdcb6e);
  color:#000; font-weight:800; font-size:0.75rem; padding:4px 12px; border-radius:20px; margin-top:8px;
}
.install-prompt {
  background:linear-gradient(135deg,var(--accent),#4834d4); border-radius:14px; padding:14px 18px;
  margin:12px 0; display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  transition:transform 0.15s;
}
.install-prompt:active { transform:scale(0.97); }
.install-prompt span { font-weight:700; font-size:0.9rem; }
.install-prompt .dismiss { background:none; border:none; color:rgba(255,255,255,0.6); font-size:1.2rem; cursor:pointer; }
.countdown {
  background:var(--surface); border-radius:12px; padding:12px; margin:16px 0;
  text-align:center; border:1px solid var(--accent);
}
.countdown .days { font-size:2rem; font-weight:800; color:var(--accent-light); }
.countdown .label { color:var(--text2); font-size:0.8rem; }

/* Nav Tabs */
.nav { display:flex; gap:6px; margin:16px 0; overflow-x:auto; -webkit-overflow-scrolling:touch; }
.nav button {
  flex-shrink:0; padding:10px 18px; border:none; border-radius:12px;
  background:var(--surface); color:var(--text2); font-size:0.85rem; font-weight:600;
  cursor:pointer; transition:all 0.2s;
}
.nav button.active { background:var(--accent); color:#fff; }

/* Sections */
.section { display:none; }
.section.active { display:block; }

/* Chapter List */
.chapter-grid { display:flex; flex-direction:column; gap:10px; }
.chapter-card {
  background:var(--surface); border-radius:var(--radius); padding:16px;
  cursor:pointer; transition:transform 0.15s, background 0.2s;
  display:flex; align-items:center; gap:14px;
}
.chapter-card:active { transform:scale(0.97); }
.chapter-card .ch-num {
  width:40px; height:40px; border-radius:10px; display:flex;
  align-items:center; justify-content:center; font-weight:800;
  font-size:0.9rem; flex-shrink:0;
}
.chapter-card .ch-info h3 { font-size:0.95rem; font-weight:700; }
.chapter-card .ch-info p { font-size:0.75rem; color:var(--text2); margin-top:2px; }
.chapter-card .progress-dot {
  margin-left:auto; width:24px; height:24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:0.7rem;
  background:var(--surface2); flex-shrink:0;
}
.chapter-card .progress-dot.done { background:var(--green); color:#fff; }

/* Unit headers */
.unit-header {
  font-size:0.75rem; font-weight:700; color:var(--accent-light); text-transform:uppercase;
  letter-spacing:1px; margin:20px 0 8px; padding-left:4px;
}

/* Chapter Content View */
.chapter-view { display:none; }
.chapter-view.active { display:block; }
.back-btn {
  background:none; border:none; color:var(--accent-light); font-size:0.9rem;
  cursor:pointer; padding:8px 0; font-weight:600; display:flex; align-items:center; gap:6px;
}
.back-btn::before { content:'←'; }
.chapter-title {
  font-size:1.3rem; font-weight:800; margin:12px 0 8px;
}
.chapter-content {
  line-height:1.7; font-size:0.9rem;
}
.chapter-content h3 {
  font-size:1rem; font-weight:700; margin:20px 0 8px; color:var(--accent-light);
  border-bottom:1px solid var(--surface2); padding-bottom:6px;
}
.chapter-content h4 {
  font-size:0.9rem; font-weight:700; margin:14px 0 6px; color:var(--orange);
}
.chapter-content p { margin:8px 0; color:var(--text); }
.chapter-content ul { margin:6px 0 6px 20px; }
.chapter-content li { margin:4px 0; color:var(--text); }
.chapter-content strong { color:var(--accent-light); }
.chapter-content .key-term {
  background:var(--surface2); padding:2px 8px; border-radius:6px;
  font-weight:600; color:var(--green); display:inline;
}
.chapter-content table {
  width:100%; border-collapse:collapse; margin:12px 0; font-size:0.8rem;
}
.chapter-content th {
  background:var(--accent); color:#fff; padding:8px 10px; text-align:left;
  font-weight:600; font-size:0.75rem;
}
.chapter-content td {
  padding:8px 10px; border-bottom:1px solid var(--surface2);
}
.chapter-content tr:nth-child(even) { background:var(--surface); }
.model-box {
  background:var(--surface); border-left:3px solid var(--accent); border-radius:0 12px 12px 0;
  padding:14px; margin:12px 0;
}
.model-box .model-name { font-weight:700; color:var(--accent-light); }
.model-box .model-creator { font-size:0.8rem; color:var(--text2); }
.model-box p { font-size:0.85rem; margin-top:6px; }

/* Flashcards */
.flashcard-controls {
  display:flex; justify-content:space-between; align-items:center; margin:12px 0;
}
.flashcard-counter { font-size:0.85rem; color:var(--text2); }
.flashcard-container {
  perspective:1000px; margin:12px 0; min-height:280px;
}
.flashcard {
  width:100%; min-height:280px; position:relative; cursor:pointer;
  transform-style:preserve-3d; transition:transform 0.5s;
}
.flashcard.flipped { transform:rotateY(180deg); }
.flashcard-face {
  position:absolute; width:100%; min-height:280px; backface-visibility:hidden;
  border-radius:var(--radius); padding:24px; display:flex;
  flex-direction:column; justify-content:center; align-items:center; text-align:center;
}
.flashcard-front {
  background:linear-gradient(135deg, var(--surface), var(--surface2));
  border:2px solid var(--accent);
}
.flashcard-front .term { font-size:1.3rem; font-weight:800; }
.flashcard-front .hint { color:var(--text2); font-size:0.8rem; margin-top:12px; }
.flashcard-back {
  background:linear-gradient(135deg, #1e1e3a, var(--surface));
  border:2px solid var(--green); transform:rotateY(180deg);
}
.flashcard-back .definition { font-size:0.95rem; line-height:1.6; }
.flashcard-back .example { color:var(--text2); font-size:0.8rem; margin-top:12px; font-style:italic; }
.flashcard-actions {
  display:flex; gap:12px; margin:16px 0; justify-content:center;
}
.flashcard-actions button {
  padding:14px 28px; border:none; border-radius:12px; font-weight:700;
  font-size:0.9rem; cursor:pointer; transition:transform 0.15s;
}
.flashcard-actions button:active { transform:scale(0.95); }
.btn-know { background:var(--green); color:#fff; }
.btn-dunno { background:var(--red); color:#fff; }
.btn-next { background:var(--surface2); color:var(--text); }

/* Quiz */
.quiz-question {
  background:var(--surface); border-radius:var(--radius); padding:20px; margin:12px 0;
}
.quiz-question .q-num { font-size:0.75rem; color:var(--accent-light); font-weight:700; }
.quiz-question .q-text { font-size:1rem; font-weight:600; margin:8px 0 16px; line-height:1.5; }
.quiz-option {
  display:block; width:100%; text-align:left; padding:14px 16px;
  background:var(--surface2); border:2px solid transparent; border-radius:12px;
  color:var(--text); font-size:0.9rem; margin:8px 0; cursor:pointer;
  transition:all 0.2s; font-family:inherit;
}
.quiz-option:hover { border-color:var(--accent); }
.quiz-option.correct { background:#00b89433; border-color:var(--green); }
.quiz-option.wrong { background:#ff6b6b33; border-color:var(--red); }
.quiz-option.reveal { border-color:var(--green); }
.quiz-explanation {
  background:var(--surface2); border-radius:12px; padding:14px; margin-top:12px;
  font-size:0.85rem; line-height:1.5; display:none;
}
.quiz-explanation.show { display:block; }
.quiz-score {
  text-align:center; padding:24px; background:var(--surface); border-radius:var(--radius);
}
.quiz-score .score-num { font-size:3rem; font-weight:800; color:var(--accent-light); }
.quiz-score .score-label { color:var(--text2); font-size:0.9rem; }
.quiz-nav { display:flex; gap:10px; margin:16px 0; justify-content:center; }
.quiz-nav button {
  padding:12px 24px; border:none; border-radius:12px; font-weight:700;
  cursor:pointer; font-size:0.9rem; background:var(--accent); color:#fff;
}

/* Glossary */
.search-box {
  width:100%; padding:14px 16px; background:var(--surface); border:2px solid var(--surface2);
  border-radius:12px; color:var(--text); font-size:1rem; font-family:inherit;
  outline:none; transition:border-color 0.2s;
}
.search-box:focus { border-color:var(--accent); }
.glossary-list { margin:16px 0; }
.glossary-item {
  background:var(--surface); border-radius:12px; padding:14px; margin:8px 0;
}
.glossary-item .g-term { font-weight:700; color:var(--green); font-size:0.9rem; }
.glossary-item .g-chapter { font-size:0.7rem; color:var(--text2); }
.glossary-item .g-def { font-size:0.85rem; margin-top:4px; line-height:1.5; }
.glossary-count { font-size:0.8rem; color:var(--text2); margin:8px 0; }

/* Progress */
.progress-card {
  background:var(--surface); border-radius:var(--radius); padding:16px; margin:10px 0;
}
.progress-card h3 { font-size:0.9rem; font-weight:700; margin-bottom:10px; }
.progress-bar-bg {
  height:8px; background:var(--surface2); border-radius:4px; overflow:hidden;
}
.progress-bar-fill {
  height:100%; background:var(--accent); border-radius:4px; transition:width 0.5s;
}
.progress-stat {
  display:flex; justify-content:space-between; margin-top:6px;
  font-size:0.8rem; color:var(--text2);
}
.mode-tabs {
  display:flex; gap:6px; margin:12px 0;
}
.mode-tabs button {
  flex:1; padding:10px; border:2px solid var(--surface2); border-radius:12px;
  background:var(--surface); color:var(--text2); font-size:0.8rem; font-weight:600;
  cursor:pointer; transition:all 0.2s; font-family:inherit;
}
.mode-tabs button.active { border-color:var(--accent); color:var(--accent-light); background:var(--surface2); }

/* Animations */
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.fade-in { animation:fadeIn 0.3s ease; }
@keyframes slideInRight { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }
@keyframes slideInLeft { from{opacity:0;transform:translateX(-30px)} to{opacity:1;transform:translateX(0)} }
@keyframes popIn { 0%{transform:scale(0.8);opacity:0} 50%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
@keyframes confettiFall { 0%{transform:translateY(-100vh) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }
.slide-right { animation:slideInRight 0.3s ease; }
.slide-left { animation:slideInLeft 0.3s ease; }
.pop-in { animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
.shake { animation:shake 0.3s ease; }
.confetti-piece {
  position:fixed; width:10px; height:10px; border-radius:2px; top:-20px;
  animation:confettiFall 3s linear forwards; pointer-events:none; z-index:9999;
}
/* Swipe hint */
.swipe-hint {
  text-align:center; color:var(--text2); font-size:0.75rem; margin:4px 0;
  opacity:0.7;
}
/* Smooth tab indicator */
.nav { position:relative; }
.nav::after {
  content:''; position:absolute; bottom:0; height:3px; background:var(--accent);
  border-radius:2px; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
/* Score ring */
.score-ring {
  width:120px; height:120px; border-radius:50%; margin:0 auto 16px;
  background:conic-gradient(var(--accent-light) var(--pct), var(--surface2) var(--pct));
  display:flex; align-items:center; justify-content:center;
}
.score-ring-inner {
  width:100px; height:100px; border-radius:50%; background:var(--surface);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
}
.score-ring-inner .big { font-size:1.8rem; font-weight:900; color:var(--accent-light); }
.score-ring-inner .small { font-size:0.7rem; color:var(--text2); }

/* Scrollbar */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--surface2); border-radius:2px; }
</style>
</head>

<div class="container">

const CHAPTERS = [
{id:1,unit:1,unitName:"Thinking Geographically",title:"Basic Concepts",color:"#6c5ce7"},

{id:3,unit:2,unitName:"Population & Migration",title:"Migration",color:"#00b894"},

{id:5,unit:3,unitName:"Cultural Patterns",title:"Language",color:"#fdcb6e"},
{id:6,unit:3,unitName:"Cultural Patterns",title:"Religion",color:"#fdcb6e"},
{id:7,unit:3,unitName:"Cultural Patterns",title:"Ethnicity",color:"#fdcb6e"},
{id:8,unit:4,unitName:"Political Geography",title:"Political Geography",color:"#e17055"},
{id:9,unit:5,unitName:"Agriculture & Development",title:"Development",color:"#74b9ff"},
{id:10,unit:5,unitName:"Agriculture & Development",title:"Agriculture",color:"#74b9ff"},
{id:11,unit:6,unitName:"Industrialization",title:"Industry",color:"#ff7675"},
{id:12,unit:7,unitName:"Cities & Urban Land Use",title:"Services",color:"#a29bfe"},
{id:13,unit:7,unitName:"Cities & Urban Land Use",title:"Urban Patterns",color:"#a29bfe"},
{id:14,unit:7,unitName:"Cities & Urban Land Use",title:"Resource Issues",color:"#a29bfe"}
];

const STUDY_CONTENT = {
1: `<h3>What Is Geography?</h3>
<p><strong>Geography</strong> — the study of where things are found and why they're there. <strong>Human geography</strong> studies how people make places, organize space, and interact with environments.</p>

<h3>Key Concepts of Place</h3>
<ul>
<li><strong>Toponym</strong> — the name given to a place</li>
<li><strong>Site</strong> — physical characteristics of a place (climate, terrain, water)</li>
<li><strong>Situation</strong> — location relative to other places; helps find unfamiliar places by comparing to known ones</li>
</ul>

<h3>Types of Regions</h3>
<ul>
<li><strong>Formal (uniform) region</strong> — everyone shares a common trait (French-speaking Canada, the Corn Belt)</li>
<li><strong>Functional (nodal) region</strong> — organized around a focal point (TV broadcast area, pizza delivery zone)</li>
<li><strong>Vernacular (perceptual) region</strong> — exists in people's minds, fuzzy boundaries ("the South," "Midwest")</li>
</ul>

<h3>Maps & Spatial Tools</h3>
<ul>
<li><strong>GIS</strong> — computer system for capturing, storing, and analyzing spatial data</li>
<li><strong>GPS</strong> — satellite-based system that determines precise position on Earth</li>
<li><strong>Remote sensing</strong> — acquiring data about Earth from satellites or aircraft</li>
</ul>
<h4>Map Projections</h4>
<p>All projections distort something. Key trade-offs:</p>
<ul>
<li><strong>Mercator</strong> — preserves shapes, distorts size (Greenland looks as big as Africa)</li>
<li><strong>Robinson</strong> — compromise projection, somewhat accurate shape and size</li>
<li><strong>Equal-area</strong> — preserves area, distorts shapes</li>
</ul>
<h4>Map Types</h4>
<ul>
<li><strong>Choropleth</strong> — uses shading by area (population density by state)</li>
<li><strong>Dot distribution</strong> — dots show occurrences</li>
<li><strong>Isoline</strong> — lines connect equal values (contour lines, temperature)</li>
<li><strong>Cartogram</strong> — distorts area to show data (bigger = more population)</li>
<li><strong>Proportional symbol</strong> — symbol size represents data values</li>
</ul>

<h3>Distribution Properties</h3>
<ul>
<li><strong>Density</strong> — frequency per unit area</li>
<li><strong>Concentration</strong> — clustered vs. dispersed</li>
<li><strong>Pattern</strong> — geometric arrangement (linear, random, regular)</li>
</ul>

<h3>Diffusion Types ⭐</h3>
<div class="model-box">
<div class="model-name">Diffusion</div>
<p><strong>Relocation</strong> — spread through physical movement of people (migrants bringing food traditions)<br>
<strong>Expansion</strong> — spreads outward from a source:<br>
&nbsp;&nbsp;• <strong>Hierarchical</strong> — important places/people first (fashion trends)<br>
&nbsp;&nbsp;• <strong>Contagious</strong> — spreads to everything nearby (disease, wildfire)<br>
&nbsp;&nbsp;• <strong>Stimulus</strong> — underlying idea spreads but is adapted (McDonald's → local fast food chains)</p>
</div>`,

2: `<h3>Where People Live</h3>
<p><strong>Ecumene</strong> — the portion of Earth permanently inhabited by people. Most of the world's population is clustered in four regions: <strong>East Asia</strong>, <strong>South Asia</strong>, <strong>Europe</strong>, and <strong>Southeast Asia</strong>.</p>

<h3>Density Measures ⭐</h3>
<ul>
<li><strong>Arithmetic density</strong> — total population ÷ total land area</li>
<li><strong>Physiological density</strong> — population ÷ arable land → shows pressure on farmland</li>
<li><strong>Agricultural density</strong> — # of farmers ÷ arable land → shows farming efficiency</li>
</ul>

<h3>Population Growth Measures</h3>
<ul>
<li><strong>NIR (Natural Increase Rate)</strong> — % annual growth = CBR − CDR</li>
<li><strong>CBR</strong> — crude birth rate (births per 1,000)</li>
<li><strong>CDR</strong> — crude death rate (deaths per 1,000)</li>
<li><strong>TFR</strong> — total fertility rate (avg children per woman; replacement = 2.1)</li>
<li><strong>IMR</strong> — infant mortality rate (deaths under age 1 per 1,000 births)</li>
<li><strong>Doubling time</strong> ≈ 70 ÷ NIR</li>
</ul>

<h3>Demographic Transition Model ⭐⭐</h3>
<div class="model-box">
<div class="model-name">DTM — THE Most Important AP Model</div>
<table>
<tr><th>Stage</th><th>CBR</th><th>CDR</th><th>NIR</th><th>Growth</th></tr>
<tr><td>1</td><td>High</td><td>High</td><td>Low</td><td>Slow</td></tr>
<tr><td>2</td><td>High</td><td>Dropping</td><td>High</td><td>Rapid</td></tr>
<tr><td>3</td><td>Falling</td><td>Low</td><td>Moderate</td><td>Slowing</td></tr>
<tr><td>4</td><td>Low</td><td>Low</td><td>Near zero</td><td>Stable</td></tr>
<tr><td>5</td><td>Very low</td><td>Low</td><td>Negative</td><td>Declining</td></tr>
</table>
<p>CDR drops first (medicine, sanitation). CBR drops later (urbanization, education, contraception).</p>
</div>

<h3>Epidemiologic Transition</h3>
<ol>
<li><strong>Pestilence & famine</strong> — infectious disease, poor nutrition</li>
<li><strong>Receding pandemics</strong> — improved sanitation</li>
<li><strong>Degenerative diseases</strong> — heart disease, cancer (aging population)</li>
<li><strong>Delayed degenerative</strong> — medical advances extend life</li>
<li><strong>Possible Stage 5</strong> — reemergence of infectious disease</li>
</ol>

<h3>Malthus</h3>
<p><strong>Malthusian theory</strong> — population grows exponentially, food grows linearly → inevitable catastrophe. Critics say technology (Green Revolution) has kept pace. The DTM shows population growth naturally slows.</p>

<h3>Population Policies</h3>
<ul>
<li><strong>Pro-natalist</strong> — encourage births (France, Sweden: parental leave, child subsidies)</li>
<li><strong>Anti-natalist</strong> — discourage births (China's one-child policy, now relaxed)</li>
</ul>`,

3: `<h3>Migration Basics</h3>
<ul>
<li><strong>Immigration</strong> — moving INTO a country</li>
<li><strong>Emigration</strong> — moving OUT of a country</li>
<li><strong>Net migration</strong> — immigration minus emigration</li>
<li><strong>Circulation</strong> — short-term, repetitive movement (commuting)</li>
</ul>

<h3>Push & Pull Factors ⭐</h3>
<ul>
<li><strong>Push factors</strong> — force people to leave: war, poverty, disaster, persecution</li>
<li><strong>Pull factors</strong> — attract people to a destination: jobs, freedom, family, climate</li>
<li><strong>Intervening obstacles</strong> — barriers (ocean, borders, cost, language)</li>
<li><strong>Intervening opportunity</strong> — acceptable closer alternative</li>
</ul>

<h3>Ravenstein's Laws</h3>
<ul>
<li>Most migrate short distances</li>
<li>Long-distance migrants go to big cities</li>
<li>Each migration stream produces a counter-stream</li>
<li>Rural residents migrate more than urban</li>
</ul>

<h3>Types of Migration</h3>
<ul>
<li><strong>Voluntary</strong> vs. <strong>Forced</strong> (refugees, slavery)</li>
<li><strong>Internal:</strong> Interregional (between regions) vs. Intraregional (within a region, e.g., city → suburb)</li>
<li><strong>International:</strong> Economic migrants, refugees, asylum seekers</li>
<li><strong>IDP</strong> — Internally Displaced Person (forced to flee but stays in own country)</li>
</ul>

<h3>Key Concepts</h3>
<ul>
<li><strong>Chain migration</strong> — following family/friends who migrated before you</li>
<li><strong>Step migration</strong> — village → town → city (series of shorter moves)</li>
<li><strong>Brain drain</strong> — educated people leave developing countries</li>
<li><strong>Remittances</strong> — money migrants send home (huge economic impact for LDCs)</li>
<li><strong>Guest workers</strong> — temporary foreign workers (Turks in Germany)</li>
</ul>

<h3>US Immigration Waves</h3>
<ul>
<li><strong>Pre-1840s:</strong> British, West African (forced)</li>
<li><strong>1840s-1880s:</strong> Irish, German ("Old Immigration")</li>
<li><strong>1880s-1920s:</strong> Southern/Eastern European ("New Immigration")</li>
<li><strong>1920s-1965:</strong> Quota laws restricted non-Western European</li>
<li><strong>1965-present:</strong> Latin American, Asian</li>
</ul>`,

4: `<h3>Folk vs. Popular Culture ⭐</h3>
<table>
<tr><th>Feature</th><th>Folk Culture</th><th>Popular Culture</th></tr>
<tr><td>Origin</td><td>Anonymous, tradition</td><td>Known source, innovation</td></tr>
<tr><td>Diffusion</td><td>Slow, relocation</td><td>Rapid, hierarchical</td></tr>
<tr><td>Distribution</td><td>Clustered, isolated</td><td>Widespread, global</td></tr>
<tr><td>Landscape</td><td>Unique, local materials</td><td>Uniform, commercial</td></tr>
</table>

<h3>Folk Culture</h3>
<p>Traditional practices of small, homogeneous groups. Spreads through <strong>relocation diffusion</strong>. Examples: Amish lifestyle, Himalayan yak butter tea, regional folk music.</p>
<p><strong>Folk housing</strong> — built with local materials reflecting climate. US types: New England saltbox, "I-house," shotgun house.</p>

<h3>Popular Culture</h3>
<p>Practices of large, heterogeneous societies. Spreads through <strong>hierarchical diffusion</strong> (media, internet). Creates <strong>uniform landscapes</strong> (same chain stores everywhere).</p>
<ul>
<li><strong>Placelessness</strong> — loss of uniqueness as popular culture homogenizes</li>
<li><strong>Cultural imperialism</strong> — dominance of one culture over another (Americanization)</li>
<li><strong>Taboo</strong> — cultural restriction on behavior (food taboos vary globally)</li>
</ul>

<h3>Cultural Landscape</h3>
<p>The visible imprint of human activity on the natural landscape — what a place looks like reflects who lives there.</p>`,

5: `<h3>Language Basics</h3>
<ul>
<li><strong>Language family</strong> — collection of related languages from common ancestor</li>
<li><strong>Language branch</strong> — subdivision of family</li>
<li><strong>Language group</strong> — further subdivision of branch</li>
<li><strong>Dialect</strong> — regional variation of a language</li>
</ul>

<h3>Major Language Families</h3>
<ul>
<li><strong>Indo-European</strong> (~45% of speakers) — English, Spanish, Hindi, Russian, French</li>
<li><strong>Sino-Tibetan</strong> (~20%) — Mandarin Chinese</li>
<li><strong>Niger-Congo</strong> — Sub-Saharan Africa</li>
<li><strong>Afro-Asiatic</strong> — Arabic, Hebrew</li>
<li><strong>Austronesian</strong> — Southeast Asia, Pacific Islands</li>
<li><strong>Dravidian</strong> — Southern India (Tamil, Telugu)</li>
</ul>

<h3>Language Diffusion</h3>
<ul>
<li><strong>Proto-Indo-European</strong> — hypothetical common ancestor</li>
<li><strong>Kurgan hypothesis</strong> — spread from Central Asian steppes by nomadic herders</li>
<li><strong>Anatolian hypothesis</strong> — spread from Turkey with agriculture</li>
</ul>

<h3>Key Terms</h3>
<ul>
<li><strong>Lingua franca</strong> — common language for different groups (English globally, Swahili in East Africa)</li>
<li><strong>Pidgin</strong> — simplified language for trade</li>
<li><strong>Creole</strong> — pidgin that becomes someone's native language</li>
<li><strong>Isolated language</strong> — unrelated to any other (Basque)</li>
<li><strong>Extinct language</strong> — no native speakers remain</li>
</ul>`,

<tr><td>Holy places</td><td>Related to founder's life</td><td>Related to nature</td></tr>
<tr><td>Examples</td><td>Christianity, Islam, Buddhism</td><td>Hinduism, Judaism, Shinto</td></tr>

<p>Branches: <strong>Roman Catholic, Protestant, Eastern Orthodox</strong>. Hearth: Palestine. Diffused through colonialism and missionaries.</p>

7: `<h3>Key Definitions</h3>

<li><strong>Race</strong> — identity based on perceived biological differences (socially constructed)</li>

<li><strong>Nationality</strong> — identity with a country</li>

8: `<h3>States & Nations ⭐</h3>
<ul>
<li><strong>State</strong> — sovereign territory with defined borders and government</li>
<li><strong>Nation</strong> — group sharing cultural identity</li>
<li><strong>Nation-state</strong> — territory = nation's homeland (Japan, Iceland)</li>
<li><strong>Multinational state</strong> — contains multiple nations (UK, Russia)</li>
<li><strong>Multistate nation</strong> — nation across multiple states (Kurds)</li>
<li><strong>Stateless nation</strong> — nation without a state (Kurds, Palestinians)</li>
</ul>

<h3>Boundary Types</h3>
<ul>
<li><strong>Physical/natural</strong> — rivers, mountains (Rio Grande)</li>
<li><strong>Cultural</strong> — language, religion, ethnicity</li>
<li><strong>Geometric</strong> — straight lines (US-Canada 49th parallel)</li>
<li><strong>Antecedent</strong> — drawn before significant settlement</li>
<li><strong>Subsequent</strong> — drawn after cultural landscape develops</li>
<li><strong>Superimposed</strong> — forced by outsiders (colonial Africa)</li>
<li><strong>Relic</strong> — no longer functions but visible (Berlin Wall)</li>
</ul>

<h3>Shapes of States</h3>
<table>
<tr><th>Shape</th><th>Description</th><th>Example</th></tr>

<tr><td>Elongated</td><td>Long and narrow</td><td>Chile</td></tr>
<tr><td>Prorupted</td><td>Compact + extension</td><td>Thailand</td></tr>

10: `<h3>Agricultural Revolutions</h3>
<ul>
<li><strong>First (Neolithic)</strong> — ~10,000 years ago, shift to farming. Hearths: Fertile Crescent, East Asia, Mesoamerica</li>
<li><strong>Second</strong> — 1700s-1800s, mechanization alongside Industrial Revolution</li>

<h3>Subsistence vs. Commercial Agriculture</h3>

<tr><th>Feature</th><th>Subsistence</th><th>Commercial</th></tr>

<tr><td>Labor</td><td>Intensive</td><td>Mechanized</td></tr>
<tr><td>Farm size</td><td>Small</td><td>Large</td></tr>
<tr><td>Location</td><td>Developing countries</td><td>Developed countries</td></tr>
</table>

<h3>Types of Agriculture</h3>

<li><strong>Pastoral nomadism</strong> — herding across arid lands. <strong>Transhumance</strong> = seasonal movement.</li>
<li><strong>Intensive subsistence</strong> — wet rice paddies in monsoon Asia</li>

<ul>

<li><strong>Dairy farming</strong> — near urban markets (milkshed)</li>

<li><strong>Mediterranean</strong> — olives, grapes, fruits</li>

11: `<h3>Industrial Revolution</h3>
<p>Began in <strong>Great Britain</strong> late 1700s (textiles, iron, coal). Spread to Europe, North America, then East Asia.</p>

<h3>Situation Factors (transportation costs)</h3>
<ul>
<li><strong>Bulk-reducing</strong> — output weighs less than inputs → locate near raw materials (copper smelting, steel)</li>
<li><strong>Bulk-gaining</strong> — output weighs more or costlier to ship → locate near market (soft drinks, baking)</li>
<li><strong>Break-of-bulk point</strong> — where goods transfer between transport modes (ports, rail yards)</li>
</ul>

<h3>Site Factors</h3>
<ul>
<li><strong>Labor</strong> — #1 site factor globally. Cheap labor attracts manufacturing.</li>
<li><strong>Land, capital, energy</strong> — affect location decisions</li>
</ul>

<h3>Weber's Least Cost Theory ⭐</h3>
<div class="model-box">
<div class="model-name">Weber's Least Cost Theory (1909)</div>
<div class="model-creator">Alfred Weber</div>
<p>Industry locates to minimize <strong>transportation costs</strong> (distance to inputs + market). Also considers <strong>labor costs</strong> and <strong>agglomeration</strong>.</p>
<p><strong>Agglomeration</strong> — clustering for shared resources. <strong>Deglomeration</strong> — spreading out when too concentrated.</p>
</div>

<h3>Changing Industry</h3>
<ul>
<li><strong>Fordism</strong> — mass production, assembly lines (early 1900s)</li>
<li><strong>Post-Fordism</strong> — flexible production, small batches, just-in-time delivery</li>
<li><strong>NIDL</strong> — New International Division of Labor: manufacturing shifts to developing countries</li>
<li><strong>Outsourcing</strong> — contracting to outside companies</li>
<li><strong>Offshoring</strong> — moving production abroad</li>
<li><strong>Maquiladora</strong> — US-owned factory in Mexico near the border</li>
<li><strong>Right-to-work laws</strong> — can't require union membership → attracts industry to Sun Belt</li>
</ul>`,

12: `<h3>Three Types of Services</h3>
<ul>
<li><strong>Consumer services</strong> — retail, health, education, leisure</li>
<li><strong>Business (producer) services</strong> — financial, professional, transport/info</li>

<p>Small towns have few services (gas station). Big cities add specialized ones (opera, pro sports). Larger market areas contain smaller ones = <strong>nesting hierarchy</strong>.</p>

<h3>Settlement Patterns</h3>

const GLOSSARY = [];
Object.entries(FLASHCARDS).forEach(([ch, cards]) => {
  cards.forEach(c => {
    GLOSSARY.push({term:c.t, def:c.d, chapter:parseInt(ch), example:c.e});
  });
});
GLOSSARY.sort((a,b) => a.term.localeCompare(b.term));

// ========== STATE ==========
let currentTab = 'study';
let currentChapter = null;
let flashState = {chapter:null, index:0, known:{}};
let quizState = {chapter:null, currentQ:0, answers:[], showingResults:false};

function getProgress() {
  try { return JSON.parse(localStorage.getItem('aphg-progress')||'{}'); } catch { return {}; }
}
function saveProgress(p) { localStorage.setItem('aphg-progress', JSON.stringify(p)); }

// ========== COUNTDOWN ==========
function updateCountdown() {
  const exam = new Date('2026-05-05T08:00:00-06:00');
  const now = new Date();
  const diff = Math.max(0, Math.ceil((exam - now) / 86400000));
  document.getElementById('countdown-days').textContent = diff;
}
updateCountdown();
setInterval(updateCountdown, 60000);

// ========== PWA ==========
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('installPrompt').style.display = 'flex';
});
function installPWA() {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    document.getElementById('installPrompt').style.display = 'none';
    deferredPrompt = null;
  });
}

// ========== HAPTICS ==========
function haptic(type) {
  if(!navigator.vibrate) return;
  if(type==='light') navigator.vibrate(10);
  else if(type==='medium') navigator.vibrate(20);
  else if(type==='success') navigator.vibrate([10,50,10]);
  else if(type==='error') navigator.vibrate([30,30,30]);
}

// ========== CONFETTI ==========
function confetti(count=30) {
  const colors = ['#6c5ce7','#a29bfe','#00b894','#fdcb6e','#ff6b6b','#74b9ff','#fd79a8'];
  for(let i=0;i<count;i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random()*100+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDelay = Math.random()*0.5+'s';
    el.style.animationDuration = (2+Math.random()*2)+'s';
    el.style.width = (6+Math.random()*8)+'px';
    el.style.height = (6+Math.random()*8)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4000);
  }
}

// ========== STREAK ==========
function updateStreak() {
  const p = getProgress();
  const today = new Date().toISOString().slice(0,10);
  const lastStudy = p._lastStudyDate;
  if(lastStudy !== today) {
    const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
    if(lastStudy === yesterday) {
      p._streak = (p._streak||0) + 1;
    } else if(lastStudy !== today) {
      p._streak = 1;
    }
    p._lastStudyDate = today;
    saveProgress(p);
  }
  const streak = p._streak || 0;
  if(streak > 0) {
    document.getElementById('streakArea').innerHTML = `<div class="streak-badge pop-in">🔥 ${streak} day streak</div>`;
  }
}
updateStreak();

// ========== SWIPE GESTURES ==========
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)*0.7) return; // too short or too vertical
  // Swipe on flashcards
  if(currentTab === 'flash' && document.getElementById('flashcardArea').style.display !== 'none') {
    if(dx < -60) { haptic('light'); flashAction('dunno'); } // swipe left = don't know
    else if(dx > 60) { haptic('success'); flashAction('know'); } // swipe right = know it
  }
}, {passive:true});

// ========== NAVIGATION ==========
document.querySelectorAll('.nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById('sec-'+currentTab).classList.add('active');
    if (currentTab === 'glossary') renderGlossary();
    if (currentTab === 'progress') renderProgress();
    if (currentTab === 'flash') renderFlashChapterSelect();
    if (currentTab === 'quiz') renderQuizChapterSelect();
  });
});

// ========== STUDY ==========
function renderChapterList() {
  let html = '';
  let lastUnit = 0;
  CHAPTERS.forEach(ch => {
    if (ch.unit !== lastUnit) {
      html += `<div class="unit-header">Unit ${ch.unit}: ${ch.unitName}</div>`;
      lastUnit = ch.unit;
    }
    const p = getProgress();
    const read = p[`study-${ch.id}`] ? 'done' : '';
    html += `<div class="chapter-card" onclick="openChapter(${ch.id})">
      <div class="ch-num" style="background:${ch.color}22;color:${ch.color}">${ch.id}</div>
      <div class="ch-info"><h3>${ch.title}</h3><p>Chapter ${ch.id}</p></div>
      <div class="progress-dot ${read}">${read?'✓':''}</div>
    </div>`;
  });
  document.getElementById('chapterList').innerHTML = html;
}
renderChapterList();

function openChapter(id) {
  const ch = CHAPTERS.find(c=>c.id===id);
  document.getElementById('chViewTitle').textContent = `Ch ${id}: ${ch.title}`;
  document.getElementById('chViewContent').innerHTML = STUDY_CONTENT[id] || '<p>Content coming soon...</p>';
  document.getElementById('chapterList').style.display = 'none';
  document.getElementById('chapterView').classList.add('active');
  document.getElementById('chapterView').classList.add('fade-in');
  // Mark as read
  const p = getProgress(); p[`study-${id}`] = true; saveProgress(p);
  window.scrollTo(0,0);
}
function closeChapter() {
  document.getElementById('chapterView').classList.remove('active');
  document.getElementById('chapterList').style.display = 'block';
  renderChapterList();
}

// ========== FLASHCARDS ==========
function renderFlashChapterSelect() {
  let html = '<div class="chapter-grid">';
  let lastUnit = 0;
  CHAPTERS.forEach(ch => {
    if (ch.unit !== lastUnit) {
      html += `<div class="unit-header">Unit ${ch.unit}: ${ch.unitName}</div>`;
      lastUnit = ch.unit;
    }
    const cards = FLASHCARDS[ch.id] || [];
    const p = getProgress();
    const known = Object.keys(p).filter(k=>k.startsWith(`flash-${ch.id}-`)&&p[k]).length;
    html += `<div class="chapter-card" onclick="startFlashcards(${ch.id})">
      <div class="ch-num" style="background:${ch.color}22;color:${ch.color}">🃏</div>
      <div class="ch-info"><h3>${ch.title}</h3><p>${cards.length} cards • ${known}/${cards.length} mastered</p></div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('flashChapterSelect').innerHTML = html;
  document.getElementById('flashChapterSelect').style.display = 'block';
  document.getElementById('flashcardArea').style.display = 'none';
}
function startFlashcards(chId) {
  const cards = FLASHCARDS[chId];
  if (!cards || !cards.length) return;
  flashState = {chapter:chId, index:0, known:{}};
  document.getElementById('flashChapterSelect').style.display = 'none';
  document.getElementById('flashcardArea').style.display = 'block';
  renderFlashcard();
}
function renderFlashcard() {
  const cards = FLASHCARDS[flashState.chapter];
  const card = cards[flashState.index];
  document.getElementById('flashTerm').textContent = card.t;
  document.getElementById('flashDef').textContent = card.d;
  document.getElementById('flashExample').textContent = card.e ? `Example: ${card.e}` : '';
  document.getElementById('flashCounter').textContent = `${flashState.index+1} / ${cards.length}`;
  document.getElementById('flashcard').classList.remove('flipped');
  // Add slide animation
  const container = document.querySelector('.flashcard-container');
  container.classList.remove('slide-right','slide-left');
  void container.offsetWidth; // force reflow
  container.classList.add('slide-right');
}
function flipCard() {
  document.getElementById('flashcard').classList.toggle('flipped');
}
function flashAction(action) {
  const cards = FLASHCARDS[flashState.chapter];
  if (action === 'know') {
    haptic('success');
    const p = getProgress();
    p[`flash-${flashState.chapter}-${flashState.index}`] = true;
    p._lastStudyDate = new Date().toISOString().slice(0,10);
    saveProgress(p);
  } else {
    haptic('light');
  }
  flashState.index++;
  if (flashState.index >= cards.length) {
    flashState.index = 0;
    confetti(40);
    haptic('success');
  }
  renderFlashcard();
  updateStreak();
}
function closeFlashcards() {
  renderFlashChapterSelect();
}

// ========== QUIZ ==========
function renderQuizChapterSelect() {
  let html = '<div class="chapter-grid">';
  let lastUnit = 0;
  CHAPTERS.forEach(ch => {
    if (ch.unit !== lastUnit) {
      html += `<div class="unit-header">Unit ${ch.unit}: ${ch.unitName}</div>`;
      lastUnit = ch.unit;
    }
    const qs = QUIZZES[ch.id] || [];
    const p = getProgress();
    const score = p[`quiz-${ch.id}-score`];
    const scoreText = score !== undefined ? `Last: ${score}/${qs.length}` : `${qs.length} questions`;
    html += `<div class="chapter-card" onclick="startQuiz(${ch.id})">
      <div class="ch-num" style="background:${ch.color}22;color:${ch.color}">📝</div>
      <div class="ch-info"><h3>${ch.title}</h3><p>${scoreText}</p></div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('quizChapterSelect').innerHTML = html;
  document.getElementById('quizChapterSelect').style.display = 'block';
  document.getElementById('quizArea').style.display = 'none';
}
function startQuiz(chId) {
  const qs = QUIZZES[chId];
  if (!qs || !qs.length) return;
  quizState = {chapter:chId, currentQ:0, answers:Array(qs.length).fill(null), showingResults:false};
  document.getElementById('quizChapterSelect').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  renderQuiz();
}
function renderQuiz() {
  const qs = QUIZZES[quizState.chapter];
  if (quizState.showingResults) {
    const correct = quizState.answers.filter((a,i) => a === qs[i].a).length;
    const p = getProgress();
    p[`quiz-${quizState.chapter}-score`] = correct;
    saveProgress(p);
    const pct = Math.round(correct/qs.length*100);
    if(pct >= 80) confetti(50);
    let html = `<div class="quiz-score pop-in">
      <div class="score-ring" style="--pct:${pct}%">
        <div class="score-ring-inner">
          <div class="big">${pct}%</div>
          <div class="small">${correct}/${qs.length} correct</div>
        </div>
      </div>
      <div class="score-label" style="font-size:1.1rem;font-weight:700;margin-top:8px">${pct===100 ? '🎉 PERFECT SCORE!' : pct >= 80 ? '🔥 Great job!' : pct >= 60 ? '👍 Getting there!' : '💪 Keep grinding!'}</div>
    </div>`;
    // Show all questions with answers
    qs.forEach((q, i) => {
      html += `<div class="quiz-question" style="margin-top:16px">
        <div class="q-num">Question ${i+1}</div>
        <div class="q-text">${q.q}</div>`;
      q.o.forEach((opt, j) => {
        let cls = '';
        if (j === q.a) cls = 'correct';
        else if (quizState.answers[i] === j && j !== q.a) cls = 'wrong';
        html += `<div class="quiz-option ${cls}" style="cursor:default">${opt}</div>`;
      });
      html += `<div class="quiz-explanation show">💡 ${q.exp}</div></div>`;
    });
    html += `<div class="quiz-nav">
      <button onclick="renderQuizChapterSelect()">← Back</button>
      <button onclick="startQuiz(${quizState.chapter})">Retry</button>
    </div>`;
    document.getElementById('quizArea').innerHTML = html;
    window.scrollTo(0,0);
    return;
  }
  const q = qs[quizState.currentQ];
  const answered = quizState.answers[quizState.currentQ] !== null;
  let html = `<div class="flashcard-controls">
    <button class="back-btn" onclick="renderQuizChapterSelect()">Back</button>
    <div class="flashcard-counter">${quizState.currentQ+1} / ${qs.length}</div>
  </div>
  <div class="quiz-question fade-in">
    <div class="q-num">Question ${quizState.currentQ+1}</div>
    <div class="q-text">${q.q}</div>`;
  q.o.forEach((opt, i) => {
    let cls = '';
    if (answered) {
      if (i === q.a) cls = 'correct';
      else if (quizState.answers[quizState.currentQ] === i) cls = 'wrong';
    }
    const disabled = answered ? 'style="pointer-events:none"' : '';
    html += `<button class="quiz-option ${cls}" ${disabled} onclick="answerQuiz(${i})">${opt}</button>`;
  });
  html += `<div class="quiz-explanation ${answered?'show':''}">💡 ${q.exp}</div>`;
  html += '</div>';
  if (answered) {
    const isLast = quizState.currentQ >= qs.length - 1;
    html += `<div class="quiz-nav">
      <button onclick="${isLast ? 'finishQuiz()' : 'nextQuestion()'}">${isLast ? 'See Results' : 'Next →'}</button>
    </div>`;
  }
  document.getElementById('quizArea').innerHTML = html;
}
function answerQuiz(idx) {
  const qs = QUIZZES[quizState.chapter];
  const correct = idx === qs[quizState.currentQ].a;
  quizState.answers[quizState.currentQ] = idx;
  if(correct) { haptic('success'); } else { haptic('error'); }
  const p = getProgress();
  p._lastStudyDate = new Date().toISOString().slice(0,10);
  saveProgress(p);
  renderQuiz();
  updateStreak();
}
function nextQuestion() {
  quizState.currentQ++;
  renderQuiz();
  window.scrollTo(0,0);
}
function finishQuiz() {
  quizState.showingResults = true;
  renderQuiz();
}

// ========== GLOSSARY ==========
function renderGlossary(filter) {
  const f = (filter||'').toLowerCase();
  const filtered = f ? GLOSSARY.filter(g => g.term.toLowerCase().includes(f) || g.def.toLowerCase().includes(f)) : GLOSSARY;
  document.getElementById('glossaryCount').textContent = `${filtered.length} terms`;
  const html = filtered.slice(0,100).map(g => `
    <div class="glossary-item">
      <span class="g-term">${g.term}</span>
      <span class="g-chapter">Ch ${g.chapter}</span>
      <div class="g-def">${g.def}${g.example ? `<br><em style="color:var(--text2);font-size:0.8rem">Ex: ${g.example}</em>` : ''}</div>
    </div>`).join('');
  document.getElementById('glossaryList').innerHTML = html || '<p style="color:var(--text2);text-align:center;padding:20px">No terms found.</p>';
}
function filterGlossary(val) { renderGlossary(val); }

// ========== PROGRESS ==========
function renderProgress() {
  const p = getProgress();
  let html = '<h2 style="font-size:1.2rem;font-weight:800;margin-bottom:16px">📊 Your Progress</h2>';

  // Overall stats
  const studyDone = CHAPTERS.filter(ch => p[`study-${ch.id}`]).length;
  const totalFlash = Object.values(FLASHCARDS).reduce((s,c)=>s+c.length,0);
  const flashDone = Object.keys(p).filter(k=>k.startsWith('flash-')&&p[k]).length;
  const quizDone = CHAPTERS.filter(ch => p[`quiz-${ch.id}-score`]!==undefined).length;

  html += `<div class="progress-card">
    <h3>📖 Study Guide</h3>
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${studyDone/14*100}%"></div></div>
    <div class="progress-stat"><span>${studyDone}/14 chapters read</span><span>${Math.round(studyDone/14*100)}%</span></div>
  </div>`;
  html += `<div class="progress-card">
    <h3>🃏 Flashcards</h3>
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${flashDone/totalFlash*100}%;background:var(--green)"></div></div>
    <div class="progress-stat"><span>${flashDone}/${totalFlash} cards mastered</span><span>${Math.round(flashDone/totalFlash*100)}%</span></div>
  </div>`;
  html += `<div class="progress-card">
    <h3>📝 Quizzes</h3>
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${quizDone/14*100}%;background:var(--orange)"></div></div>
    <div class="progress-stat"><span>${quizDone}/14 quizzes completed</span><span>${Math.round(quizDone/14*100)}%</span></div>
  </div>`;

  // Per-chapter breakdown
  html += '<h3 style="margin-top:24px;font-size:1rem;font-weight:700">By Chapter</h3>';
  CHAPTERS.forEach(ch => {
    const cards = FLASHCARDS[ch.id]||[];
    const cardsDone = Object.keys(p).filter(k=>k.startsWith(`flash-${ch.id}-`)&&p[k]).length;
    const quizScore = p[`quiz-${ch.id}-score`];
    const studied = p[`study-${ch.id}`] ? '✅' : '⬜';
    html += `<div class="progress-card" style="padding:12px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:600;font-size:0.85rem">${studied} Ch ${ch.id}: ${ch.title}</span>
        <span style="font-size:0.75rem;color:var(--text2)">🃏${cardsDone}/${cards.length} ${quizScore!==undefined?`📝${quizScore}`:''}</span>
      </div>
    </div>`;
  });

  html += `<button onclick="if(confirm('Reset all progress?')){localStorage.removeItem('aphg-progress');renderProgress()}" style="margin:20px auto;display:block;background:var(--surface2);border:none;color:var(--red);padding:12px 20px;border-radius:12px;font-size:0.85rem;cursor:pointer">Reset Progress</button>`;

  document.getElementById('progressArea').innerHTML = html;
}

// Init
renderGlossary();
</script>
</body>
</html>
